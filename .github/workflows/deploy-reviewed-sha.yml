name: Deploy reviewed ChainSpot SHA

# Manual acceptance target for the exact reviewed ChainSpot source revision.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: ChainSpot SHA/ref to stage
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - STAGE_REF
      - .github/workflows/deploy-reviewed-sha.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_REPO: samuelpmahan/ChainSpot

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out staging control
        uses: actions/checkout@v4
        with:
          path: control

      - name: Resolve requested source ref
        id: requested
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.source_ref }}"
          else
            REF="$(tr -d '[:space:]' < control/STAGE_REF)"
            if [[ ! "$REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "STAGE_REF must contain an exact 40-character ChainSpot commit SHA." >&2
              exit 1
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check out ChainSpot source
        uses: actions/checkout@v4
        with:
          repository: samuelpmahan/ChainSpot
          ref: ${{ steps.requested.outputs.ref }}
          path: source
          fetch-depth: 1

      - name: Record exact source SHA
        id: source
        working-directory: source
        shell: bash
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### ChainSpot staging source" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested ref: \`${{ steps.requested.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact commit: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Building $SOURCE_REPO@$SHA"

      - name: Set up source Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: source/.node-version
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build staging site
        working-directory: source
        env:
          BASE_PATH: /ChainSpot-staging
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summarize deployment
        shell: bash
        run: |
          echo "### Staging deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- ChainSpot commit: \`${{ needs.build.outputs.source_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
